<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark logo with white text -->
  <defs>
    <linearGradient id="gradientTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo icon - three horizontal lines with curve -->
  <g>
    <rect x="8" y="12" width="8" height="2.5" fill="url(#gradientTeal)" rx="1"/>
    <rect x="8" y="19" width="12" height="2.5" fill="url(#gradientTeal)" rx="1"/>
    <rect x="8" y="26" width="10" height="2.5" fill="url(#gradientTeal)" rx="1"/>
  </g>
  
  <!-- Text -->
  <text x="55" y="32" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">
    SELFOWN
  </text>
</svg>
